<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sell Minerals — MinDeb Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen">

  <div id="toast-container"></div>

  <header class="sticky top-0 z-50 bg-[var(--bg-secondary)]/90 backdrop-blur border-b divider">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <span class="w-9 h-9 rounded-lg gold-gradient flex items-center justify-center text-lg">⛏️</span>
        <span class="font-heading font-extrabold text-lg gold-text" data-i18n="app_name">MinDeb Marketplace</span>
      </a>
      <a href="index.html" class="btn btn-ghost">← <span data-i18n="nav_home">Home</span></a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-10">
    <h1 class="font-heading text-3xl font-extrabold mb-1" data-i18n="upload_title">List a New Mineral</h1>
    <p class="text-[var(--text-secondary)] mb-8" data-i18n="upload_subtitle">Publish your mineral to reach verified buyers across the country</p>

    <form id="upload-form" class="card p-6 sm:p-8 space-y-6" novalidate>

      <!-- Mineral info -->
      <div>
        <label class="field-label" for="mineral-name" data-i18n="mineral_name">Mineral Name</label>
        <input id="mineral-name" type="text" class="input" required />
      </div>

      <div>
        <label class="field-label" for="mineral-description" data-i18n="description">Description</label>
        <textarea id="mineral-description" rows="4" class="input" data-i18n-placeholder="description_placeholder" required></textarea>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="field-label" for="mineral-quantity" data-i18n="quantity_optional">Quantity (optional)</label>
          <input id="mineral-quantity" type="text" class="input" placeholder="e.g. 50 kg" />
        </div>
        <div>
          <label class="field-label" for="mineral-price" data-i18n="price_optional">Price (optional)</label>
          <input id="mineral-price" type="text" class="input" placeholder="e.g. 25000" />
        </div>
      </div>

      <!-- Images -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="field-label mb-0" data-i18n="upload_images">Upload Images</label>
          <span id="image-count" class="text-xs text-[var(--text-muted)]">0/6</span>
        </div>
        <button type="button" id="upload-images-btn" class="btn btn-outline w-full border-dashed py-6">
          📷 <span data-i18n="drag_drop_images">Click to upload or drag images here</span>
        </button>
        <div id="image-previews" class="grid grid-cols-3 sm:grid-cols-4 gap-3 mt-3"></div>
      </div>

      <!-- Video -->
      <div>
        <label class="field-label" data-i18n="upload_video">Upload Video (max 65 seconds)</label>
        <button type="button" id="upload-video-btn" class="btn btn-outline w-full border-dashed py-6">
          🎥 <span data-i18n="drag_drop_images">Click to upload or drag images here</span>
        </button>
        <div id="video-preview" class="mt-3"></div>
      </div>

      <!-- Contact info -->
      <div class="border-t divider pt-6">
        <h3 class="font-heading font-semibold mb-3" data-i18n="seller_contact_info">Seller Contact Information</h3>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="field-label" for="seller-phone" data-i18n="phone_number">Phone Number</label>
            <input id="seller-phone" type="tel" class="input" placeholder="+251 9XX XXX XXX" required />
          </div>
          <div>
            <label class="field-label" for="seller-whatsapp" data-i18n="whatsapp">WhatsApp Number</label>
            <input id="seller-whatsapp" type="tel" class="input" placeholder="+251 9XX XXX XXX" />
          </div>
          <div>
            <label class="field-label" for="seller-telegram" data-i18n="telegram">Telegram Username</label>
            <input id="seller-telegram" type="text" class="input" placeholder="@username" />
          </div>
        </div>
      </div>

      <button type="submit" id="publish-btn" class="btn btn-primary w-full py-3" data-i18n="publish_listing">Publish Listing</button>
    </form>
  </main>

  <script type="module" src="js/firebase-config.js"></script>
  <script src="js/cloudinary-config.js"></script>
  <script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>
  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/upload.js"></script>
</body>
</html>
