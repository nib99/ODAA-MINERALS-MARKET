<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Unlock Seller Contact — MinDeb Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen">

  <div id="toast-container"></div>

  <header class="sticky top-0 z-50 bg-[var(--bg-secondary)]/90 backdrop-blur border-b divider">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <span class="w-9 h-9 rounded-lg gold-gradient flex items-center justify-center text-lg">⛏️</span>
        <span class="font-heading font-extrabold text-lg gold-text" data-i18n="app_name">MinDeb Marketplace</span>
      </a>
      <a href="index.html" class="btn btn-ghost">← <span data-i18n="nav_home">Home</span></a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-10">
    <h1 class="font-heading text-3xl font-extrabold mb-1" data-i18n="payment_title">Unlock Seller Contact</h1>
    <p class="text-[var(--text-secondary)] mb-6" data-i18n="payment_subtitle">Complete payment to view seller's phone, WhatsApp and Telegram</p>

    <div id="listing-summary" class="card p-4 flex items-center gap-4 mb-6"></div>

    <div id="existing-status" class="hidden mb-6"></div>

    <form id="payment-form" class="card p-6 sm:p-8 space-y-6" novalidate>
      <div>
        <label class="field-label" data-i18n="choose_payment_method">Choose Payment Method</label>
        <div id="payment-methods" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
      </div>

      <div>
        <label class="field-label" for="transaction-id" data-i18n="transaction_id">Transaction ID</label>
        <input id="transaction-id" type="text" class="input" required />
      </div>

      <div>
        <label class="field-label" data-i18n="upload_receipt">Upload Payment Receipt</label>
        <button type="button" id="upload-receipt-btn" class="btn btn-outline w-full border-dashed py-6">
          🧾 <span data-i18n="drag_drop_images">Click to upload or drag images here</span>
        </button>
        <div id="receipt-preview" class="mt-3"></div>
      </div>

      <button type="submit" id="submit-payment-btn" class="btn btn-primary w-full py-3" data-i18n="submit_payment">Submit for Review</button>
    </form>
  </main>

  <script type="module" src="js/firebase-config.js"></script>
  <script src="js/cloudinary-config.js"></script>
  <script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>
  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/payment.js"></script>
</body>
</html>
